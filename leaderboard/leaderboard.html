<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  body { font-family: "Inter", sans-serif; }
  #stage { position: absolute; inset: 0; }

  .title {
    position: absolute; left: 50%; top: 250px; height: 84px;
    transform-origin: center center;
    display: flex; align-items: center; gap: 0; filter: drop-shadow(0 8px 18px rgba(0,0,0,.45));
  }
  .title .tag {
    background: #1f3a8a; color: #fff; font-weight: 900; font-size: 42px; letter-spacing: 2px;
    padding: 0 34px; height: 84px; display: flex; align-items: center; border-radius: 16px 0 0 16px;
  }
  .title .q {
    background: #fff; color: #1f3a8a; font-weight: 900; font-size: 42px; letter-spacing: 1px;
    padding: 0 34px; height: 84px; display: flex; align-items: center; border-radius: 0 16px 16px 0;
  }

  .row {
    position: absolute; left: 50%; width: 1000px; height: 70px; margin-left: -500px;
    border-radius: 35px; background: #fff; display: flex; align-items: center;
    box-shadow: 0 6px 16px rgba(0,0,0,.35); overflow: hidden;
  }
  .row .rank {
    width: 96px; height: 70px; display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 32px; color: #111; background: #fff;
    border-right: 3px solid #e3e3e3; flex: none;
  }
  .row .chip { width: 14px; height: 40px; border-radius: 4px; margin: 0 22px 0 26px; flex: none; }
  .row .name { font-weight: 800; font-size: 34px; color: #111; letter-spacing: .3px; white-space: nowrap; }
  .row .bg { position: absolute; inset: 0; background: #0d0d0f; opacity: 0; border-radius: 35px; }
  .row .content { position: relative; display: flex; align-items: center; width: 100%; height: 100%; }
  .row .shine {
    position: absolute; top: 0; bottom: 0; width: 180px; left: -200px;
    background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.35) 50%, rgba(255,255,255,0) 100%);
    transform: skewX(-20deg);
  }
  .row .score {
    margin-left: auto; margin-right: 34px; font-weight: 900; font-size: 36px; color: #111;
    font-variant-numeric: tabular-nums; letter-spacing: .5px;
  }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ---------- EDIT THIS DATA FOR EACH QUESTION ----------
const TITLE_TAG = "LEADERBOARD";
const TITLE_Q   = "AFTER QUESTION 1";
const TEAMS = [
  { rank: "1",  name: "Mangham High School A",           color: "#3fae5a", score: "5" },
  { rank: "2",  name: "Natchitoches Central High School", color: "#4aa3df", score: "4" },
  { rank: "3",  name: "Hybrid D",                         color: "#9db7cf", score: "3", highlight: true },
  { rank: "4",  name: "Negreet High School A",            color: "#d9b13b", score: "2" },
  { rank: "5",  name: "First Baptist Church School A",    color: "#d0566e", score: "1" },
];
const DURATION = 10;   // seconds
// ------------------------------------------------------

const stage = document.getElementById('stage');
const ROW_TOP = 380, ROW_GAP = 86;

const title = document.createElement('div');
title.className = 'title';
title.innerHTML = `<div class="tag">${TITLE_TAG}</div><div class="q">${TITLE_Q}</div>`;
stage.appendChild(title);

const rows = TEAMS.map((t, i) => {
  const el = document.createElement('div');
  el.className = 'row';
  el.style.top = (ROW_TOP + i * ROW_GAP) + 'px';
  el.innerHTML = `<div class="bg"></div><div class="shine"></div>
    <div class="content">
      <div class="rank">${t.rank}</div>
      <div class="chip" style="background:${t.color}"></div>
      <div class="name">${t.name}</div>
      <div class="score">${t.score}</div>
    </div>`;
  stage.appendChild(el);
  return { el, t, i,
    bg: el.querySelector('.bg'), shine: el.querySelector('.shine'),
    rank: el.querySelector('.rank'), name: el.querySelector('.name'),
    score: el.querySelector('.score') };
});

const clamp = (x) => Math.max(0, Math.min(1, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeIn  = (x) => x * x * x;
const easeOutBack = (x) => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const mix = (a, b, k) => Math.round(a + (b - a) * k);
const mixColor = (c1, c2, k) => `rgb(${mix(c1[0],c2[0],k)},${mix(c1[1],c2[1],k)},${mix(c1[2],c2[2],k)})`;

const OUT = DURATION - 1.3;   // outro start

function render(t) {
  // Title: pop in, fade out
  const ti = easeOutBack(prog(t, 0.0, 0.55));
  const to = easeIn(prog(t, OUT + 0.5, OUT + 0.9));
  title.style.opacity = Math.min(prog(t, 0, 0.25), 1 - to);
  title.style.transform = `translateX(-50%) scale(${0.6 + 0.4 * ti - 0.1 * to})`;

  rows.forEach(r => {
    // scroll up into place, staggered (top row first)
    const a = 0.35 + r.i * 0.14;
    const pin = easeOut(prog(t, a, a + 0.6));
    // scroll up and out, staggered
    const b = OUT + r.i * 0.08;
    const pout = easeIn(prog(t, b, b + 0.45));
    const y = (1 - pin) * 140 - pout * 50;
    let scale = 1;

    let hk = 0;
    if (r.t.highlight) {
      // highlight transition (like the Norway bar)
      const hs = 1.75;
      hk = easeOut(prog(t, hs, hs + 0.35));
      const pop = prog(t, hs, hs + 0.6);
      scale = 1 + 0.06 * Math.sin(Math.PI * Math.min(pop, 1)) * (pop < 1 ? 1 : 0) + 0.035 * hk;
      r.bg.style.opacity = hk;
      r.rank.style.background = mixColor([255,255,255],[13,13,15],hk);
      r.rank.style.color = mixColor([17,17,17],[255,255,255],hk);
      r.rank.style.borderRightColor = mixColor([227,227,227],[60,60,66],hk);
      r.name.style.color = mixColor([17,17,17],[255,255,255],hk);
      r.score.style.color = mixColor([17,17,17],[255,255,255],hk);
      // shine sweeps across shortly after, and again mid-hold
      const sw1 = prog(t, hs + 0.25, hs + 0.95);
      const sw2 = prog(t, 5.2, 5.9);
      const sw = (sw1 > 0 && sw1 < 1) ? sw1 : sw2;
      r.shine.style.left = (-200 + sw * 1400) + 'px';
      r.el.style.zIndex = 5;
    }
    r.el.style.opacity = Math.min(prog(t, a, a + 0.25), 1 - pout);
    r.el.style.transform = `translateY(${y}px) scale(${scale})`;
  });
}
window.render = render;
window.DURATION = DURATION;
render(0);
</script>
</body>
</html>
